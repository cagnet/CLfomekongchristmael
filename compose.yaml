services:
  customerorders.api:
    image: customerorders.api
    build:
      context: .
      dockerfile: src/CustomerOrders.Api/Dockerfile
  customerorders.db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      MSSQL_SA_PASSWORD: YourStrong!Password123
      ACCEPT_EULA: Y

